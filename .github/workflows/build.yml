name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: nix flake check
        run: nix flake check --print-build-logs

      - name: nix build
        run: nix build .#amnezia-vpn --print-build-logs

      - name: Verify the payload binaries actually run
        run: |
          ./result/share/amnezia-vpn/bin/amneziawg-go --version
          ./result/share/amnezia-vpn/bin/openvpn --version | head -1
          ./result/share/amnezia-vpn/bin/tun2socks --version | head -1

      - name: Verify nothing is left unlinked
        run: |
          # The runner's own ldd uses Ubuntu's glibc, which is older than the
          # Nix one and misreports version requirements, so ask the binary's
          # own Nix interpreter instead.
          bin=./result/share/amnezia-vpn/bin/AmneziaVPN
          interp=$(readelf -l "$bin" | sed -n 's/.*interpreter: \(.*\)\]/\1/p')
          missing=$("$interp" --list "$bin" | grep 'not found' || true)
          if [ -n "$missing" ]; then
            echo "unresolved libraries:"; echo "$missing"; exit 1
          fi
          echo "all libraries resolved"
